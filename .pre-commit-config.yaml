repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run python -c "from pathlib import Path; import subprocess, sys; sys.exit(subprocess.call([sys.executable, '-m', 'pytest']) if Path('tests').exists() else 0)"
        language: system
        pass_filenames: false
        stages: [pre-push]
